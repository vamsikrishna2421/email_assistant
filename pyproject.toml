[project]
name = "jerry"
version = "0.1.0"
description = "Jerry — a private inbox assistant that reads your email on your own machine"
requires-python = ">=3.12,<3.13"

dependencies = [
  # local web dashboard + API
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  # HTML form posts from the dashboard
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  # storage
  "sqlalchemy>=2.0,<3",
  # http to Gmail and Ollama
  "httpx>=0.27",
  # menu-bar app
  "pystray>=0.19.5",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
build = ["pyinstaller>=6"]

[project.scripts]
jerry = "jerry.__main__:main"

[project.gui-scripts]
jerry-gui = "jerry.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jerry = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
